name: Deploy Todo backend

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    APP_NAME: "todo-backend"
    ENVIRONMENT: "Production"

jobs:
    build:
        name: Build and Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  java-version: 25
                  distribution: temurin
                  cache: maven
            - name: Build application
              run: ./mvnw clean package -DskipTests

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Docker image
              run: |
                  docker build \
                    -t ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest  \
                    .
                    echo "Docker image built: ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest"

            - name: Push Docker image to DockerHub
              run: |
                  docker push ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest
                  echo "Docker image pushed to DockerHub: ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest"
