name: Deploy Todo backend

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    APP_NAME: "todo-backend"
    ENVIRONMENT: "Production"
    CONTAINER_NAME: "todo-backend-container"

jobs:
    build:
        name: Build and Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  java-version: 25
                  distribution: temurin
                  cache: maven
            - name: Build application
              run: ./mvnw clean package

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Docker image
              run: |
                  docker build \
                    -t ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest  \
                    .
                    echo "Docker image built: ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest"

            - name: Push Docker image to DockerHub
              run: |
                  docker push ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest
                  echo "Docker image pushed to DockerHub: ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest"

            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: ${{vars.AWS_EC2_HOST}}
                  username: ${{vars.AWS_EC2_USER}}
                  key: ${{secrets.AWS_EC2_PASSWORD}}
                  script: |
                      docker pull ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest
                      docker stop ${{env.CONTAINER_NAME}} || true
                      docker rm ${{env.CONTAINER_NAME}} || true
                      docker run -d \
                       --name ${{env.CONTAINER_NAME}} \
                        -p 8080:8080  \
                        ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:latest
                      docker image prune -f
                      echo "Deployment completed on EC2: ${{vars.AWS_EC2_HOST}}"
